name: Release

# Push a tag such as v1.2.0 to build, test, and publish the release with its packages.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check the tag matches the manifest version
        run: |
          version=$(node -p "require('./src/manifest.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match manifest version $version"; exit 1; }
      - run: npm run package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          notes=$(awk -v version="$version" '$0 ~ "^## " version {found=1; next} /^## / && found {exit} found' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" \
            dist/copyhold-chromium.zip \
            "dist/copyhold-$version-chromium.zip" \
            "dist/copyhold-$version-firefox.zip" \
            --title "Copyhold $version" \
            --notes "${notes:-See the changelog.}"
