name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package

  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx puppeteer browsers install chrome
      - run: npx puppeteer browsers install firefox
      # Ubuntu blocks the unprivileged user namespaces Chrome's sandbox uses; allow them rather than turn the sandbox off.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Headless Chrome and Firefox share the virtual display's clipboard.
      - run: xvfb-run --auto-servernum npm run test:e2e
